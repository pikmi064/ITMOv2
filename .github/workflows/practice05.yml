name: Practice 5
on:
  push:
    paths: ['practices/practice_05/**', '.github/workflows/practice05.yml']
  pull_request:
    paths: ['practices/practice_05/**', '.github/workflows/practice05.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practices/practice_05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: practices/practice_05/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make spec-check check e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice05-evidence
          path: practices/practice_05/evidence/
